<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="280" height="240">
  <defs>
    <!-- Sky blue gradient -->
    <radialGradient id="sky" cx="60%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#29b6f6"/>
      <stop offset="50%" stop-color="#0288d1"/>
      <stop offset="100%" stop-color="#01579b"/>
    </radialGradient>
    <!-- Sun gradient -->
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="40%" stop-color="#ffca28"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </radialGradient>
    <!-- Water gradient -->
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0288d1"/>
      <stop offset="100%" stop-color="#01579b"/>
    </linearGradient>
    <!-- Palm leaf green -->
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66bb6a"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <!-- Clip to main circle -->
    <clipPath id="mainClip">
      <circle cx="140" cy="110" r="100"/>
    </clipPath>
  </defs>

  <!-- ── White outer glow ring ── -->
  <circle cx="140" cy="110" r="107" fill="white" opacity="0.15"/>

  <!-- ── Main circle background (sky) ── -->
  <circle cx="140" cy="110" r="104" fill="white"/>
  <circle cx="140" cy="110" r="100" fill="url(#sky)"/>

  <!-- ── All content clipped inside circle ── -->
  <g clip-path="url(#mainClip)">

    <!-- Water / sea base -->
    <ellipse cx="140" cy="185" rx="105" ry="30" fill="url(#water)" opacity="0.85"/>
    <path d="M40 175 Q90 165 140 172 Q190 179 240 170 L240 215 Q190 220 140 215 Q90 210 40 215Z"
      fill="#0277bd" opacity="0.6"/>
    <!-- Wave highlights -->
    <path d="M40 178 Q90 170 140 176 Q190 182 240 174" stroke="#4fc3f7" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M40 183 Q90 175 140 181 Q190 187 240 179" stroke="#81d4fa" stroke-width="1" fill="none" opacity="0.3"/>

    <!-- ── SUN (top right) ── -->
    <circle cx="195" cy="52" r="32" fill="url(#sun)"/>
    <!-- Sun rays -->
    <g stroke="#ffca28" stroke-width="3" stroke-linecap="round" opacity="0.7">
      <line x1="195" y1="14" x2="195" y2="6"/>
      <line x1="217" y1="22" x2="223" y2="16"/>
      <line x1="231" y1="44" x2="239" y2="40"/>
      <line x1="225" y1="68" x2="231" y2="74"/>
      <line x1="173" y1="22" x2="167" y2="16"/>
      <line x1="157" y1="44" x2="149" y2="40"/>
    </g>
    <!-- Sun face shine -->
    <circle cx="195" cy="52" r="26" fill="#ffe082" opacity="0.4"/>

    <!-- ── ORBITAL SWOOSH (white arc around) ── -->
    <ellipse cx="140" cy="110" rx="96" ry="32"
      fill="none" stroke="white" stroke-width="4"
      transform="rotate(-22 140 110)" opacity="0.95"/>

    <!-- ── PALM TREE ── -->
    <!-- Trunk -->
    <path d="M128 178 Q130 155 133 130 Q135 112 138 95"
      stroke="#5d4037" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- Trunk curve lower -->
    <path d="M128 178 Q132 165 133 150"
      stroke="#4e342e" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Fronds -->
    <path d="M138 95 Q120 74 100 78" stroke="#388e3c" stroke-width="5.5" stroke-linecap="round" fill="none"/>
    <path d="M138 95 Q128 70 131 55" stroke="#43a047" stroke-width="5.5" stroke-linecap="round" fill="none"/>
    <path d="M138 95 Q152 70 165 74" stroke="#388e3c" stroke-width="5.5" stroke-linecap="round" fill="none"/>
    <path d="M138 95 Q155 84 168 90" stroke="#2e7d32" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M138 95 Q118 87 106 95" stroke="#43a047" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M138 95 Q142 76 155 68" stroke="#2e7d32" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Coconuts at base of fronds -->
    <circle cx="132" cy="99" r="5.5" fill="#795548"/>
    <circle cx="139" cy="96" r="5"   fill="#6d4c41"/>
    <circle cx="146" cy="99" r="4.5" fill="#795548"/>

    <!-- ── AIRPLANE (upper left, flying) ── -->
    <g transform="translate(62,60) rotate(-30)">
      <!-- Body -->
      <ellipse cx="0" cy="0" rx="22" ry="6" fill="white"/>
      <!-- Wings -->
      <path d="M-4 0 L8 -16 L16 -10 L4 0Z"  fill="white"/>
      <path d="M-4 0 L8  16 L16  10 L4 0Z"  fill="#e0e0e0"/>
      <!-- Tail -->
      <path d="M-16 0 L-22 -8 L-18 0Z"  fill="white"/>
      <path d="M-16 0 L-22  8 L-18 0Z"  fill="#e0e0e0"/>
      <!-- Window stripe -->
      <rect x="-2" y="-3" width="14" height="6" rx="3" fill="#29b6f6" opacity="0.6"/>
    </g>

  </g>

  <!-- ── Circle border (white + slight shadow) ── -->
  <circle cx="140" cy="110" r="104" fill="none" stroke="white" stroke-width="5"/>
  <circle cx="140" cy="110" r="100" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>

  <!-- ── COMPANY NAME TEXT ── -->
  <!-- Dark blue background band -->
  <rect x="20" y="220" width="240" height="18" rx="0" fill="none"/>

  <!-- HIKAYAT AL SAHRA -->
  <text x="140" y="220"
    text-anchor="middle"
    font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
    font-size="18"
    font-weight="900"
    fill="#1a237e"
    letter-spacing="1">HIKAYAT AL SAHRA</text>

  <!-- Underline -->
  <line x1="30" y1="225" x2="250" y2="225" stroke="#1a237e" stroke-width="1.5" opacity="0.4"/>

  <!-- TOURISM -->
  <text x="140" y="240"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="11"
    font-weight="600"
    fill="#0288d1"
    letter-spacing="5">TOURISM</text>
</svg>
